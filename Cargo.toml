[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/azamrizki/nextplane"

[workspace.dependencies]
np-core = { path = "crates/np-core" }
np-store = { path = "crates/np-store" }
np-api = { path = "crates/np-api" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
uuid = { version = "1", features = ["v7", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "fs", "time", "sync"] }
axum = { version = "0.8", features = ["multipart", "ws"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "uuid", "time"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tempfile = "3"
http-body-util = "0.1"
argon2 = "0.5"
getrandom = "0.3"
sha2 = "0.10"
csv = "1.3"
base64 = "0.22"
axum-extra = { version = "0.10", features = ["cookie"] }
rust-embed = { version = "8", features = ["include-exclude"] }
mime_guess = "2"
ammonia = "4"
yrs = { version = "0.26", features = ["sync"] }
tar = "0.4"
flate2 = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form"] }
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-rustls", "rustls-native-certs", "ring", "smtp-transport", "builder", "hostname"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Password hashing is far too slow unoptimized; keep tests and `make dev` fast.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
