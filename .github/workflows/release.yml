name: release
on:
  push:
    tags: ["v*"]
  # A trial run builds and smoke-tests every target but publishes nothing.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A binary from tag v1.2.3 must call itself 1.2.3, or `nextplane update` never settles.
      - name: tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="v$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          [ "$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, but Cargo.toml says $v" >&2; exit 1; }
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: cd web && npm ci && npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist

  build:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, name: linux-amd64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, name: linux-arm64 }
          - { os: macos-15-intel, target: x86_64-apple-darwin, name: darwin-amd64 }
          - { os: macos-15, target: aarch64-apple-darwin, name: darwin-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: build
        env:
          NEXTPLANE_COMMIT: ${{ github.sha }}
        run: |
          export NEXTPLANE_BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cargo build --release --locked -p nextplane --target ${{ matrix.target }}
          mkdir -p nextplane-${{ matrix.name }}
          cp target/${{ matrix.target }}/release/nextplane nextplane-${{ matrix.name }}/
          cp LICENSE README.md nextplane-${{ matrix.name }}/
          tar -czf nextplane-${{ matrix.name }}.tar.gz nextplane-${{ matrix.name }}
      # The binary starts on a fresh data folder and serves its API and the embedded web app.
      - name: smoke test
        run: |
          bin=nextplane-${{ matrix.name }}/nextplane
          file "$bin"
          if [ "$RUNNER_OS" = Linux ]; then file "$bin" | grep -Eq 'statically linked|static-pie linked'; fi
          "$bin" --version
          data="$RUNNER_TEMP/np-smoke"
          "$bin" --data "$data" serve --listen 127.0.0.1:12399 > "$RUNNER_TEMP/serve.log" 2>&1 &
          pid=$!
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:12399/api/v1/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:12399/api/v1/version
          curl -fsS http://127.0.0.1:12399/ | grep -q '<div id="root">'
          kill "$pid"
          wait "$pid" || true
          cat "$RUNNER_TEMP/serve.log"
      - uses: actions/upload-artifact@v7
        with:
          name: nextplane-${{ matrix.name }}
          path: nextplane-${{ matrix.name }}.tar.gz

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: nextplane-*
          merge-multiple: true
      - run: sha256sum nextplane-*.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            nextplane-*.tar.gz
            SHA256SUMS
          prerelease: ${{ contains(github.ref_name, '-') }}
